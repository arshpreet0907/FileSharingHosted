<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peer Connect — Register</title>
  <link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body>
<div class="container auth-container">

  <div class="logo">Peer Connect</div>
  <h1>Create <span>Account</span></h1>
  <p class="subtitle">Register to start connecting with peers securely.</p>

  <!-- Registration form -->
  <div class="card" id="register-card">
    <div class="section-label">Create your account</div>

    <div class="auth-form">
      <input class="text-input" id="reg-email" type="email" placeholder="Email" autocomplete="email"/>
      <input class="text-input" id="reg-password" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password"/>
      <input class="text-input" id="reg-confirm" type="password" placeholder="Confirm password" autocomplete="new-password"/>
      <button class="btn-primary" id="reg-submit-btn" onclick="handleRegister()">Register</button>
    </div>

    <div id="reg-alert" class="hidden"></div>

    <p class="auth-footer">
      Already have an account? <a href="/login.html">Log in</a>
    </p>
  </div>

  <!-- Success message (shown after registration) -->
  <div class="card hidden" id="success-card">
    <div class="section-label" style="color:#5DCAA5">✓ Registration submitted</div>
    <p style="font-size:13px;color:#888;margin-top:0.5rem">Your account is pending admin approval.</p>
    <p style="font-size:13px;color:#888;margin-top:0.25rem"><a href="/login.html">Go to login</a></p>
  </div>

</div>

<script>
// ── Register (single step, no OTP) ──────────────────────────────────
async function handleRegister() {
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm  = document.getElementById('reg-confirm').value;
  const btn      = document.getElementById('reg-submit-btn');
  const alertEl  = document.getElementById('reg-alert');

  if (!email || !password || !confirm) {
    showAlert(alertEl, 'error', 'Please fill in all fields');
    return;
  }
  if (password.length < 6) {
    showAlert(alertEl, 'error', 'Password must be at least 6 characters');
    return;
  }
  if (password !== confirm) {
    showAlert(alertEl, 'error', 'Passwords do not match');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Registering…';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (data.ok) {
      document.getElementById('register-card').classList.add('hidden');
      document.getElementById('success-card').classList.remove('hidden');
    } else {
      showAlert(alertEl, 'error', data.error || 'Registration failed');
    }
  } catch (err) {
    showAlert(alertEl, 'error', 'Network error — is the server running?');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Register';
  }
}

function showAlert(el, type, msg) {
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.classList.remove('hidden');
}

// Enter key on confirm password triggers register
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('reg-confirm').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleRegister();
  });
});
</script>
</body>
</html>
